<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世末艳闻录 编写器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
body { background:#f5f5f5; color:#333; height:100vh; display:flex; flex-direction:column; }
.app { display:flex; flex-direction:column; height:100vh; }
.ribbon { background:#fff; border-bottom:1px solid #e0e0e0; display:flex; align-items:center; padding:8px 16px; gap:12px; flex-shrink:0; }
.ribbon h1 { font-size:18px; font-weight:600; color:#1a73e8; margin-right:auto; }
.toolbar { background:#fff; border-bottom:1px solid #e0e0e0; padding:6px 12px; display:flex; flex-wrap:wrap; gap:4px; align-items:center; flex-shrink:0; }
.toolbar button { padding:4px 10px; border:1px solid #dadce0; background:#fff; border-radius:4px; cursor:pointer; font-size:13px; }
.toolbar button:hover { background:#e8f0fe; border-color:#1a73e8; }
.toolbar .sep { width:1px; height:24px; background:#e0e0e0; margin:0 4px; }
.main { flex:1; display:flex; min-height:0; background:#fff; }
.left-pane { width:420px; min-width:320px; overflow-y:auto; padding:16px; border-right:1px solid #e0e0e0; flex-shrink:0; }
.right-pane { flex:1; display:flex; flex-direction:column; min-width:0; }
.editor-area { display:flex; flex:1; min-height:0; }
.editor-col { flex:1; display:flex; flex-direction:column; border-right:1px solid #e0e0e0; }
.editor-col textarea { flex:1; width:100%; border:none; outline:none; resize:none; padding:16px; font-size:15px; line-height:1.6; font-family:Consolas,monospace; background:#fafafa; }
.preview-col { flex:1; overflow-y:auto; padding:16px; }
.preview-col blockquote { border-left:4px solid #1a73e8; padding-left:12px; color:#666; }
.preview-col img { max-width:100%; }
.preview-col iframe { max-width:100%; }
.preview-col table { border-collapse:collapse; width:100%; margin:8px 0; }
.preview-col th,.preview-col td { border:1px solid #ccc; padding:6px 10px; text-align:left; }
.preview-col code { background:#f0f0f0; padding:2px 6px; border-radius:3px; font-size:0.9em; }
.preview-col pre { background:#f5f5f5; padding:12px; border-radius:6px; overflow-x:auto; }
.meta-form { max-width:100%; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-weight:500; margin-bottom:4px; font-size:14px; }
.form-group input,.form-group textarea { width:100%; padding:8px 12px; border:1px solid #dadce0; border-radius:6px; font-size:14px; outline:none; }
.form-group input:focus,.form-group textarea:focus { border-color:#1a73e8; box-shadow:0 0 0 2px rgba(26,115,232,.15); }
.tag-container { display:flex; flex-wrap:wrap; gap:6px; padding:8px 0; }
.tag { background:#e8f0fe; color:#1a73e8; padding:2px 10px; border-radius:12px; font-size:13px; display:inline-flex; gap:4px; }
.tag .rm { cursor:pointer; color:#999; font-weight:bold; }
.calendar-popup { position:fixed; z-index:1000; background:#fff; border:1px solid #dadce0; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.15); padding:12px; width:280px; }
.cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.cal-header button { background:none; border:none; cursor:pointer; font-size:16px; padding:4px 8px; border-radius:4px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
.cal-cell { padding:6px 0; font-size:13px; border-radius:4px; cursor:pointer; }
.cal-cell:hover { background:#e8f0fe; }
.cal-cell.empty { visibility:hidden; }
.cal-cell.today { background:#1a73e8; color:#fff; }
.cal-cell.selected { background:#1a73e8; color:#fff; }
.cal-footer { display:flex; justify-content:space-between; margin-top:8px; }
.cal-footer button { padding:4px 12px; border:1px solid #dadce0; background:#fff; border-radius:4px; cursor:pointer; }
.enc-section { margin-top:16px; padding:12px; background:#f8f9fa; border-radius:8px; border:1px solid #e0e0e0; }
.enc-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.enc-row input,.enc-row textarea { flex:1; padding:6px 10px; border:1px solid #dadce0; border-radius:4px; font-size:13px; }
.enc-row textarea { min-height:60px; resize:vertical; }
.enc-result { background:#fff; padding:8px; border-radius:4px; font-size:12px; word-break:break-all; border:1px solid #dadce0; min-height:40px; }
.dec-section { margin-top:12px; padding:12px; background:#f8f9fa; border-radius:8px; border:1px solid #e0e0e0; }
.dec-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.dec-row input { flex:1; padding:6px 10px; border:1px solid #dadce0; border-radius:4px; font-size:13px; }
.dec-result { background:#fff; padding:8px; border-radius:4px; font-size:13px; word-break:break-all; border:1px solid #dadce0; min-height:40px; white-space:pre-wrap; }
.btn { padding:8px 20px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.btn-primary { background:#1a73e8; color:#fff; }
.btn-primary:hover { background:#1557b0; }
.btn-secondary { background:#f1f3f4; color:#444; }
.toggle-row { display:flex; align-items:center; justify-content:space-between; }
.toggle-label-text { font-weight:500; font-size:14px; color:#444; }
.toggle-switch { position:relative; display:inline-block; width:44px; height:22px; flex-shrink:0; }
.toggle-switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#ccc; transition:.2s; border-radius:22px; }
.slider:before { position:absolute; content:""; height:18px; width:18px; left:2px; bottom:2px; background-color:#fff; transition:.2s; border-radius:50%; }
.toggle-switch input:checked + .slider { background-color:#1a73e8; }
.toggle-switch input:checked + .slider:before { transform:translateX(22px); }
.btn-publish { text-decoration:none !important; background-color:#dc3545; color:#fff !important; padding:8px 20px; border-radius:6px; display:inline-flex; align-items:center; gap:4px; font-size:14px; }
.btn-publish:hover { background-color:#c82333; }
</style>
</head>
<body>
<div class="app">
  <div class="ribbon">
    <h1>📝 世末艳闻录 编写器</h1>
    <div style="display:flex; gap:8px; align-items:center; margin-left:auto;">
      <button class="btn btn-primary" onclick="downloadMD()">⬇ 下载 .md</button>
      <a class="btn btn-publish" href="https://github.com/catalysia/catalysia.github.io/upload/master/_posts" target="_blank" rel="noopener noreferrer">🚀 去发布</a>
    </div>
  </div>

  <div class="main">
    <!-- 左侧：元数据 -->
    <div class="left-pane">
      <div class="meta-form">
        <div class="form-group"><label>标题 *</label><input id="fTitle" placeholder="输入文章标题"></div>
        <div class="form-group"><label>副标题 *</label><input id="fSubtitle" placeholder="输入文章副标题"></div>
        <div class="form-group"><label>发布日期 *</label><input id="fDate" placeholder="点击选择 YYYY-MM-DD" onclick="toggleCalendar(event)"></div>
        <div class="form-group"><label>作者 *</label><input id="fAuthor" value="Catalysia"></div>
        <div class="form-group"><label>头图URL *</label><input id="fHeaderImg" value="img/postimg/post-bg-2024-0401.webp"></div>
        <div class="form-group"><label>文件名 *</label><input id="fFileName" placeholder="第一个字符必须是英文字母，如 hello-world"></div>
        <div class="form-group"><label>标签（Enter 添加）</label><input id="fTagInput" onkeydown="if(event.key==='Enter'){event.preventDefault();addTag()}"><div class="tag-container" id="tagContainer"></div></div>
        <div class="toggle-row">
          <span class="toggle-label-text">启用归档</span>
          <label class="toggle-switch">
            <input type="checkbox" id="fCatalog" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="enc-section">
          <h3>🔐 加密（适配网页端）</h3>
          <p style="font-size:12px;color:#888;margin-bottom:6px;">密码：UTF-8 字符串 默认密码为Chobits</p>
          <div class="enc-row">
            <input type="password" id="encPwd" value="Chobits" oninput="updateEncrypt()">
            <button class="btn btn-secondary" onclick="encPwd.value='Chobits';updateEncrypt()">重置</button>
          </div>
          <div class="enc-row"><textarea id="encPlain" placeholder="明文" oninput="updateEncrypt()"></textarea></div>
          <div class="enc-result" id="encResult">密文（hex，可直接用于 front matter）</div>
          <div style="margin-top:8px;">
            <button class="btn btn-secondary" onclick="selfTest()">🔍 本页自检（模拟网页端解密）</button>
            <span id="selfTestMsg" style="margin-left:12px;font-size:13px;"></span>
          </div>
        </div>

        <div class="dec-section">
          <h3>🔓 解密验证（模拟网页端）</h3>
          <div class="dec-row">
            <textarea id="decHex" placeholder="密文 hex（encryptedpost 的值）" style="width:100%;min-height:80px;padding:6px 10px;border:1px solid #dadce0;border-radius:4px;font-size:13px;resize:vertical;"></textarea>
          </div>
          <div class="dec-row">
            <input type="password" id="decPwd" placeholder="密码" value="Chobits">
            <button class="btn btn-secondary" onclick="doDecryptUI()">解密</button>
          </div>
          <div class="dec-result" id="decResult">解密结果将显示在此处</div>
        </div>
      </div>
    </div>

    <!-- 右侧：编辑与预览 -->
    <div class="right-pane">
      <div class="toolbar" id="toolbar">
        <button onclick="insertFormat('# ','')">H1</button>
        <button onclick="insertFormat('## ','')">H2</button>
        <button onclick="insertFormat('### ','')">H3</button>
        <div class="sep"></div>
        <button onclick="wrapText('**','**')"><b>B</b></button>
        <button onclick="wrapText('*','*')"><i>I</i></button>
        <button onclick="wrapText('~~','~~')"><s>S</s></button>
        <button onclick="wrapText('> ','')">引用</button>
        <button onclick="wrapText('`','`')">代码</button>
        <button onclick="wrapText('- ','')">列表</button>
        <div class="sep"></div>
        <button onclick="insertLink()">🔗 链接</button>
        <button onclick="insertImage()">🖼 图片</button>
        <button onclick="insertVideo()">🎬 视频</button>
        <button onclick="insertTable()">📊 表格</button>
      </div>
      <div class="editor-area">
        <div class="editor-col"><textarea id="editor" placeholder="Markdown..."></textarea></div>
        <div class="preview-col" id="preview"></div>
      </div>
    </div>
  </div>
</div>

<div class="calendar-popup" id="calPopup" style="display:none;"></div>

<script>
(function(){
  let tags = [], selDate = '', calVisible = false;
  const $ = id => document.getElementById(id);
  const editor = $('editor'), preview = $('preview'), toolbar = $('toolbar');

  const fFileName = $('fFileName');
  fFileName.addEventListener('input', function(){
    let v = this.value
      .replace(/\s+/g, '-')
      .replace(/[^a-zA-Z0-9\-_.]/g, '');
    while (v.length > 0 && !/^[a-zA-Z]/.test(v)) { v = v.slice(1); }
    this.value = v;
  });

  /* ========== 密钥派生：补零到 8 的倍数（与网页端完全一致） ========== */
  function deriveKey(pwd){
    var utf8Bytes = CryptoJS.enc.Utf8.parse(pwd);
    var byteLen = utf8Bytes.sigBytes;
    var paddedPwd = pwd;
    while (byteLen % 8 !== 0) {
      paddedPwd += "\0";
      byteLen++;
    }
    return CryptoJS.enc.Utf8.parse(paddedPwd);
  }

  function doEncrypt(pwd, txt){
    const key = deriveKey(pwd);
    const encrypted = CryptoJS.AES.encrypt(txt, key, {
      mode: CryptoJS.mode.ECB,
      padding: CryptoJS.pad.Pkcs7
    });
    return encrypted.ciphertext.toString(CryptoJS.enc.Hex);
  }

  function doDecrypt(pwd, hexCipher){
    const key = deriveKey(pwd);
    const wordArray = CryptoJS.enc.Hex.parse(hexCipher);
    const base64Cipher = CryptoJS.enc.Base64.stringify(wordArray);
    const decrypted = CryptoJS.AES.decrypt(base64Cipher, key, {
      mode: CryptoJS.mode.ECB,
      padding: CryptoJS.pad.Pkcs7
    });
    return CryptoJS.enc.Utf8.stringify(decrypted);
  }

  window.selfTest = function(){
    const pwd = $('encPwd').value;
    const plain = $('encPlain').value;
    if(!pwd || !plain){ $('selfTestMsg').textContent = '未输密码或明文'; return; }
    try {
      const hex = doEncrypt(pwd, plain);
      const back = doDecrypt(pwd, hex);
      $('selfTestMsg').textContent = (back === plain) ? '✅ 自检OK' : '❌ 解密结果与原文不符';
    } catch(e){
      $('selfTestMsg').textContent = '❌ 异常：'+e.message;
    }
  };

  window.doDecryptUI = function(){
    const hex = $('decHex').value.trim();
    const pwd = $('decPwd').value;
    if(!hex || !pwd){ $('decResult').textContent = '请填写密文和密码'; return; }
    try {
      const plain = doDecrypt(pwd, hex);
      if(plain){
        $('decResult').textContent = plain;
      } else {
        $('decResult').textContent = '解密失败：密文或密码错误';
      }
    } catch(e){
      $('decResult').textContent = '解密异常：' + e.message;
    }
  };

  function setToday(){
    const d=new Date();
    selDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    $('fDate').value = selDate;
  }
  setToday();

  // 设置文件名初始值为 POST-ON-当前日期时间的CRC32（安全后备）
  (function initFileName(){
    try {
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
      const input = `${selDate} ${timeStr}`;
      // 尝试使用 CryptoJS.CRC32，若不可用则使用时间戳的十六进制
      let suffix;
      if (typeof CryptoJS.CRC32 === 'function') {
        suffix = CryptoJS.CRC32(input).toString();
      } else {
        suffix = Date.now().toString(16);
      }
      $('fFileName').value = `POST-ON-${suffix}`;
    } catch(e) {
      // 极端情况后备：使用当前时间戳的十六进制
      $('fFileName').value = `POST-ON-${Date.now().toString(16)}`;
    }
  })();

  // 安全的 updateEncrypt（增加错误保护）
  window.updateEncrypt = function(){
    try {
      const p = $('encPwd').value, t = $('encPlain').value;
      if(!p || !t){ $('encResult').textContent = '请输入密码和明文'; return; }
      $('encResult').textContent = doEncrypt(p, t);
    } catch(e) {
      $('encResult').textContent = '加密出错：' + e.message;
    }
  };

  function toggleCalendar(e){ e.stopPropagation(); calVisible?closeCal():openCal(); }
  window.toggleCalendar = toggleCalendar;
  function openCal(){ calVisible=true; renderCal(); document.addEventListener('click', outside, true); }
  function closeCal(){ calVisible=false; $('calPopup').style.display='none'; document.removeEventListener('click', outside, true); }
  function outside(e){ if(!$('calPopup').contains(e.target) && e.target!==$('fDate')) closeCal(); }
  function renderCal(y,m){
    const d = selDate? new Date(selDate) : new Date();
    if(y===undefined){y=d.getFullYear();m=d.getMonth();}
    const fd=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
    let h=`<div class="cal-header"><button onclick="renderCal(${y},${m-1})">‹</button><strong>${y}年${m+1}月</strong><button onclick="renderCal(${y},${m+1})">›</button></div><div class="cal-grid"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>`;
    for(let i=0;i<fd;i++) h+='<span class="cal-cell empty"></span>';
    for(let day=1;day<=dim;day++){
      const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      let c='cal-cell'; if(ds===selDate)c+=' selected';
      h+=`<span class="${c}" onclick="pickDate('${ds}')">${day}</span>`;
    }
    h+='</div><div class="cal-footer"><button onclick="pickDate(\''+selDate+'\')">今天</button><button onclick="clearDate()">清除</button></div>';
    const p=$('calPopup'); p.innerHTML=h; p.style.display='block';
    const r=$('fDate').getBoundingClientRect(); p.style.left=r.left+'px'; p.style.top=(r.bottom+4)+'px';
  }
  window.renderCal=renderCal;
  window.pickDate=ds=>{ selDate=ds; $('fDate').value=ds; closeCal(); };
  window.clearDate=()=>{ selDate=''; $('fDate').value=''; closeCal(); };

  window.addTag=()=>{ const v=$('fTagInput').value.trim(); if(!v||tags.includes(v))return; tags.push(v); $('fTagInput').value=''; renderTags(); };
  window.removeTag=i=>{ tags.splice(i,1); renderTags(); };
  function renderTags(){ $('tagContainer').innerHTML=tags.map((t,i)=>`<span class="tag">${t}<span class="rm" onclick="removeTag(${i})">×</span></span>`).join(''); }

  function getSel(){ return {s:editor.selectionStart,e:editor.selectionEnd,sel:editor.value.substring(editor.selectionStart,editor.selectionEnd)}; }
  window.insertFormat=(b,a)=>{ const x=getSel(); editor.setRangeText(b+x.sel+a,x.s,x.e,'end'); editor.focus(); render(); };
  window.wrapText=insertFormat;
  window.insertLink=()=>{ const u=prompt('URL'); if(u) insertFormat(`[${prompt('文字','链接')||'链接'}](${u})`,''); };
  window.insertImage=()=>{
    const u=prompt('图片URL', 'img/postimg/.webp');
    if(u) insertFormat(`![${prompt('alt','图片')||'图片'}](${u})`,'');
  };
  window.insertVideo=()=>{
    let inp=prompt('iframe 或 src'); if(!inp)return;
    let src=inp.match(/src=["']([^"']+)["']/i)?inp.match(/src=["']([^"']+)["']/i)[1]:inp;
    if(!/^https?:/i.test(src))src='https://'+src;
    insertFormat(`<iframe src="${src}" width="560" height="315" frameborder="0" allowfullscreen></iframe>`,'');
  };
  window.insertTable=()=>{
    const c=+prompt('列','3'), r=+prompt('行','3'); if(!c||!r)return;
    let t='|'+' 列 |'.repeat(c)+'\n|'+' --- |'.repeat(c)+'\n';
    for(let i=1;i<r;i++) t+='|'+'  |'.repeat(c)+'\n';
    insertFormat(t,'');
  };
  window.clearFormat=()=>{ const x=getSel(); if(!x.sel)return; let s=x.sel.replace(/\*\*(.+?)\*\*/g,'$1').replace(/`(.+?)`/g,'$1'); editor.setRangeText(s,x.s,x.e,'end'); render(); };

  function render(){
    let md = editor.value;
    md = md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">');
    md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    md = md.replace(/`([^`]+)`/g,'<code>$1</code>');
    md = md.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    md = md.replace(/\*(.+?)\*/g,'<i>$1</i>');
    md = md.replace(/~~(.+?)~~/g,'<s>$1</s>');
    md = md.replace(/^#### (.+)$/gm,'<h4>$1</h4>')
           .replace(/^### (.+)$/gm,'<h3>$1</h3>')
           .replace(/^## (.+)$/gm,'<h2>$1</h2>')
           .replace(/^# (.+)$/gm,'<h1>$1</h1>');
    md = md.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
    md = md.replace(/^[-*+] (.+)$/gm,'<li>$1</li>');
    md = md.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
    md = md.replace(/^---$/gm,'<hr>');
    md = md.replace(/(?:^\|.*\|\s*$\n?)+/gm, block => {
      const rows = block.trim().split('\n').map(line => {
        const cells = line.slice(1,-1).split('|').map(c => c.trim());
        if(cells.every(c => /^-+$/.test(c))) return '';
        return '<tr>'+cells.map(c => `<td>${c}</td>`).join('')+'</tr>';
      }).filter(Boolean).join('');
      return `<table border="1" cellspacing="0">${rows}</table>`;
    });
    preview.innerHTML = md;
  }
  editor.addEventListener('input', render);

  /* ========== 下载 MD（自动加密正文） ========== */
  window.downloadMD=()=>{
    const fn=$('fFileName').value.trim(); if(!fn){alert('文件名');return;}
    let enc='';
    const pwd = $('encPwd').value;
    const testPlain = $('encPlain').value;

    if(pwd){
      const textToEncrypt = testPlain.trim() ? testPlain : editor.value;
      if(textToEncrypt.trim()){
        enc = doEncrypt(pwd, textToEncrypt);
      }
    }

    const tagLine = tags.length? tags.map(t=>'    - '+t).join('\n') : '    - untagged';
    let md=`---\nlayout:     post\ntitle:      ${$('fTitle').value}\nsubtitle:   ${$('fSubtitle').value}\ndate:       ${selDate}\nauthor:     ${$('fAuthor').value}\nheader-img: ${$('fHeaderImg').value}\ncatalog:    ${$('fCatalog').checked}\n${enc?`encryptedpost: ${enc}\n`:''}tags:\n${tagLine}\n---\n\n${editor.value}\n`;

    const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${selDate}-${fn}.md`; a.click();
    URL.revokeObjectURL(a.href);
  };

  // 初始化预览
  render();
})();
</script>
</body>
</html>
